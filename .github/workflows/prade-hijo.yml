name: Preparar issue prade-hijo

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  preparar-issue:
    if: contains(github.event.issue.labels.*.name, 'prade-hijo')
    runs-on: ubuntu-latest
    steps:
      - name: Publicar estructura de seguimiento
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '**Parente issue:** Pendiente',
              '**Estimacion:** Pendiente',
              '',
              '### sub-issue',
              '- [ ] Analisis y revision de diagramas',
              '- [ ] Creacion RITM',
              '- [ ] Creacion calculadoras',
              '- [ ] Creacion de artefactos',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });